[project]
name = "swedish-addresses"
version = "0.1.0"
description = "Build a postcode and coordinate parquet file from Geotorget address data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.2",
    "geotorget @ git+https://github.com/PierreMesure/geotorget-py.git",
    "pyarrow>=18",
    "python-dotenv>=1.0",
]

[project.scripts]
build-address-pipeline = "swedish_addresses.pipeline.enrich:main"
build-address-products = "swedish_addresses.products.common:main"
build-postcode-products = "swedish_addresses.products.common:main"
build-address-ranges = "swedish_addresses.products.address_ranges:main"
build-postcode-coverage = "swedish_addresses.products.postcode_coverage:main"
build-postcode-post-towns = "swedish_addresses.products.commands:postcode_post_towns"
build-postcode-administrative-areas = "swedish_addresses.products.commands:postcode_administrative_areas"
build-postcode-parishes = "swedish_addresses.products.commands:postcode_parishes"
build-postcode-centroids = "swedish_addresses.products.commands:postcode_centroids"
build-all-products = "swedish_addresses.products.all:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
